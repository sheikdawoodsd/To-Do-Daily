<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0a0a0a">
    <title>TO DO Daily | Account</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 40 40%22%3E%3Cdefs%3E%3ClinearGradient id=%22g%22 x2=%221%22 y2=%221%22%3E%3Cstop stop-color=%22%23e50914%22/%3E%3Cstop offset=%221%22 stop-color=%22%23b20710%22/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width=%2240%22 height=%2240%22 rx=%2210%22 fill=%22url(%23g)%22/%3E%3Cpath d=%22m10 20 7 7 14-15%22 fill=%22none%22 stroke=%22white%22 stroke-width=%223.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22/%3E%3C/svg%3E">
    <script>try { document.documentElement.dataset.theme = localStorage.getItem("todoDaily_lastTheme") || "black-red"; } catch {}</script>
    <link rel="stylesheet" href="style.css">
    <script src="account.js" defer></script>
</head>
<body class="account-page">
    <main class="account-card">
        <a class="brand" href="todo.html" aria-label="TO DO Daily home">
            <span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 40 40" focusable="false"><path d="M11 20.5 17.2 27 29.5 13.5" fill="none" stroke="white" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span>
            <span class="brand-wordmark"><span class="brand-main">TO DO</span> <span class="accent">Daily</span></span>
        </a>
        <span class="eyebrow">ACCOUNT SETTINGS</span>
        <h1 id="accountUsername">Your account</h1>
        <p class="account-email" id="accountEmail"></p>
        <div class="account-options">
            <button class="btn btn-primary" id="accountLogoutBtn" type="button">Log out</button>
            <button class="danger-button" id="accountDeleteBtn" type="button">Delete account</button>
        </div>
        <button class="account-back" id="backToWebsite" type="button">Back to website</button>
    </main>

    <div class="modal-overlay" id="accountModal" hidden>
        <section class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="accountModalTitle" aria-describedby="accountModalDescription" tabindex="-1">
            <span class="modal-symbol" aria-hidden="true">!</span>
            <h2 id="accountModalTitle">Are you sure?</h2>
            <p id="accountModalDescription"></p>
            <div class="modal-actions" id="accountModalActions"></div>
        </section>
    </div>
    <div class="account-toast" id="accountToast" role="status" aria-live="polite" hidden></div>
</body>
</html>
